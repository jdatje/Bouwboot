name: check-secrets
on:
  push:
    paths: [".github/workflows/check-secrets.yml"]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Check keys (values are never printed)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          REBRICKABLE_API_KEY: ${{ secrets.REBRICKABLE_API_KEY }}
        run: |
          fail=0
          for v in GEMINI_API_KEY MODAL_TOKEN_ID MODAL_TOKEN_SECRET REBRICKABLE_API_KEY; do
            if [ -z "${!v}" ]; then echo "::error::$v is empty or missing"; fail=1; else echo "$v present"; fi
          done
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "x-goog-api-key: $GEMINI_API_KEY" https://generativelanguage.googleapis.com/v1beta/models)
          echo "Gemini: HTTP $code"; [ "$code" = 200 ] || fail=1
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: key $REBRICKABLE_API_KEY" "https://rebrickable.com/api/v3/lego/colors/?page_size=1")
          echo "Rebrickable: HTTP $code"; [ "$code" = 200 ] || fail=1
          pip install -q modal
          if modal app list >/dev/null 2>err.txt; then echo "Modal: OK"; else echo "Modal: FAILED"; tail -3 err.txt; fail=1; fi
          exit $fail
      - name: List Gemini models (names only)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          curl -s -H "x-goog-api-key: $GEMINI_API_KEY" "https://generativelanguage.googleapis.com/v1beta/models?pageSize=200" \
            | python3 -c "import json,sys; [print(m['name'], m.get('supportedGenerationMethods')) for m in json.load(sys.stdin)['models']]"
