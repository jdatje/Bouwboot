name: gpu
on:
  push:
    branches: [main]
    paths: ["gpu/**", ".github/workflows/gpu.yml"]
  workflow_dispatch:
    inputs:
      captions:
        description: "JSON list of English captions for the smoke test"
        required: false
        default: ""
      subjects:
        description: "JSON list of subjects for the 3D smoke test"
        required: false
        default: ""
      studs:
        description: "build size in studs (16 Klein, 24 Middel, 32 Groot)"
        required: false
        default: "16"
      fixtures:
        description: "JSON list of fixture names in gpu/fixtures (when no subjects)"
        required: false
        default: ""
      debug:
        description: "1 = also render the raw TRELLIS result"
        required: false
        default: ""
      skip_brickgpt:
        description: "skip the BrickGPT smoke test"
        required: false
        default: "1"
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q modal requests matplotlib numpy pillow scipy
      - name: Create GPU key secret on Modal
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          KEY=$(printf 'bouwboot:%s' "$MODAL_TOKEN_SECRET" | sha256sum | cut -d' ' -f1)
          modal secret create bouwboot-gpu BOUWBOOT_GPU_KEY="$KEY" --force >/dev/null
          modal secret create bouwboot-hf HF_TOKEN="${HF_TOKEN:-none}" --force >/dev/null
      - name: Deploy
        run: |
          set -o pipefail
          modal deploy gpu/brickgpt_app.py 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+designer-web[a-zA-Z0-9.-]*\.modal\.run' deploy.log | head -1)
          URL3D=$(grep -oE 'https://[a-zA-Z0-9.-]+shaper-web[a-zA-Z0-9.-]*\.modal\.run' deploy.log | head -1)
          URLTR=$(grep -oE 'https://[a-zA-Z0-9.-]+trellis-web[a-zA-Z0-9.-]*\.modal\.run' deploy.log | head -1 || true)
          URLTR=${URLTR:-https://jdatje--bouwboot-gpu-trellis-web.us-east.modal.run}
          echo "URLTR=$URLTR" >> $GITHUB_ENV
          echo "URL=$URL" >> $GITHUB_ENV
          echo "URL3D=$URL3D" >> $GITHUB_ENV
          echo "GPU URLs: $URL $URL3D"
      - name: Stop containers still running the previous version
        run: |
          modal container list --json > containers.json || echo "[]" > containers.json
          python - <<'PY'
          import json, subprocess
          for c in json.load(open("containers.json")):
              cid = c.get("Container ID") or c.get("container_id") or c.get("id")
              app = str(c.get("App Name") or c.get("app_name") or "")
              if cid and "bouwboot" in app:
                  subprocess.run(["modal", "container", "stop", cid])
                  print("stopped", cid)
          PY
      - name: Smoke test 3D route
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUBJECTS: ${{ github.event.inputs.subjects }}
        run: python gpu/smoke_shape.py "$URL3D"
      - name: Smoke test TRELLIS.2
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUBJECTS: ${{ github.event.inputs.subjects }}
          OUT_PREFIX: tr
          PLATES: "1"
          STUDS: ${{ github.event.inputs.studs || '16' }}
          FIXTURES: ${{ github.event.inputs.fixtures }}
          DEBUG: ${{ github.event.inputs.debug }}
        run: python gpu/smoke_shape.py "$URLTR"
      - name: Smoke test BrickGPT
        if: ${{ github.event.inputs.skip_brickgpt == '' }}
        env:
          CAPTIONS: ${{ github.event.inputs.captions }}
        run: python gpu/smoke_test.py "$URL"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: smoke, path: out/ }
